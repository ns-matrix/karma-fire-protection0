name: Admin dashboard checks
on:
  pull_request:
    paths:
      - "backend/telegram-leads/admin-v2/**"
      - "js/analytics.js"
      - "js/analytics-core.mjs"
      - "supabase/migrations/20261127120000_website_analytics_events.sql"
      - "js/analytics.js"
      - "js/analytics-core.mjs"
      - "supabase/migrations/20261127120000_website_analytics_events.sql"
      - ".github/workflows/admin-dashboard-tests.yml"
  push:
    branches:
      - "feat/role-based-responsive-dashboard"
      - "feat/website-analytics-cms-audit"
    paths:
      - "backend/telegram-leads/admin-v2/**"
      - ".github/workflows/admin-dashboard-tests.yml"
jobs:
  dashboard-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check dashboard modules
        run: |
          node --check backend/telegram-leads/admin-v2/js/dashboard-rules.js
          node --check backend/telegram-leads/admin-v2/js/role-dashboard.js
          node --check backend/telegram-leads/admin-v2/js/admin.js
          node --check js/analytics.js
      - name: Run role permission tests
        run: node --experimental-default-type=module --test backend/telegram-leads/admin-v2/tests/dashboard-rules.test.mjs backend/telegram-leads/admin-v2/tests/analytics-core.test.mjs
