name: Website portal checks
on:
  pull_request:
    paths:
      - "*.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "backend/telegram-leads/admin-v2/**"
      - "backend/telegram-leads/admin/index.html"
      - "supabase/migrations/**"
      - "README.md"
      - ".github/workflows/admin-dashboard-tests.yml"
  push:
    branches:
      - "feat/karma-zip-full-rebuild"
    paths:
      - "*.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "backend/telegram-leads/admin-v2/**"
      - "backend/telegram-leads/admin/index.html"
      - "supabase/migrations/**"
      - "README.md"
      - ".github/workflows/admin-dashboard-tests.yml"
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax checks
        run: |
          node --check js/analytics.js
          node --input-type=module --check < js/zip-public-app.js
          node --input-type=module --check < backend/telegram-leads/admin-v2/js/zip-admin.js
      - name: Website and admin integration contracts
        run: node --test backend/telegram-leads/admin-v2/tests/zip-portal-contract.test.mjs
