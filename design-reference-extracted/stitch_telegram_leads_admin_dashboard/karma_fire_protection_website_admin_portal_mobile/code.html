      m.classList.remove('hidden');

      const previewHtml = type === 'service'
        ? `<article class="bg-light-surface-container-low rounded-md border border-light-outline-variant overflow-hidden"><img src="${draft.img}" alt="${draft.name}" class="w-full h-36 object-cover" /><div class="p-gutter-md flex flex-col gap-gutter-xs"><span class="font-label text-label-sm text-light-error">${draft.subName || 'Subtitle'}</span><h3 class="font-title text-title-md">${draft.name || 'Service Name'}</h3><p class="font-body text-body-sm text-light-on-surface-variant">${draft.desc || ''}</p></div></article>`
        : type === 'team'
          ? `<article class="bg-light-surface-container-low rounded-md border border-light-outline-variant overflow-hidden"><img src="${draft.img}" alt="${draft.name}" class="w-full h-40 object-cover object-top" /><div class="p-gutter-md flex flex-col gap-gutter-xs"><span class="font-label text-label-sm text-light-error">${draft.dept || 'Department'}</span><h3 class="font-title text-title-md">${draft.name || 'Full Name'}</h3><p class="font-body text-body-sm">${draft.role || ''}</p><p class="font-body text-body-sm text-light-on-surface-variant">${draft.bio || ''}</p></div></article>`
          : `<article class="bg-light-surface-container-low rounded-md border border-light-outline-variant p-gutter-md flex flex-col gap-gutter-xs"><span class="text-warning">${'★'.repeat(Number(draft.rating) || 5)}</span><p class="font-body text-body-sm">“${draft.text || ''}”</p><p class="font-title text-title-md">${draft.reviewer || 'Reviewer'}</p><p class="font-body text-body-sm text-light-on-surface-variant">${draft.company || ''}</p></article>`;

      const formHtml = type === 'service' ? `
        <input id="med-name" required type="text" value="${draft.name}" placeholder="Service Name" class="rounded-DEFAULT border-light-outline-variant bg-light-surface-container-low font-body text-body-sm" />
        <input id="med-sub" required type="text" value="${draft.subName || ''}" placeholder="Sub Name" class="rounded-DEFAULT border-light-outline-variant bg-light-surface-container-low font-body text-body-sm" />
        <textarea id="med-desc" required rows="2" placeholder="Short summary..." class="rounded-DEFAULT border-light-outline-variant bg-light-surface-container-low font-body text-body-sm">${draft.desc}</textarea>
        <textarea id="med-points" required rows="2" placeholder="Key points (one per line)..." class="rounded-DEFAULT border-light-outline-variant bg-light-surface-container-low font-body text-body-sm">${draft.pointsText || ''}</textarea>` : type === 'team' ? `
        <input id="med-name" required type="text" value="${draft.name}" placeholder="Full Name" class="rounded-DEFAULT border-light-outline-variant bg-light-surface-container-low font-body text-body-sm" />
        <input id="med-role" required type="text" value="${draft.role || ''}" placeholder="Designation" class="rounded-DEFAULT border-light-outline-variant bg-light-surface-container-low font-body text-body-sm" />
        <input id="med-dept" required type="text" value="${draft.dept || ''}" placeholder="Department" class="rounded-DEFAULT border-light-outline-variant bg-light-surface-container-low font-body text-body-sm" />
        <input id="med-phone" required type="tel" value="${draft.phone || ''}" placeholder="Phone" class="rounded-DEFAULT border-light-outline-variant bg-light-surface-container-low font-mono text-mono-sm" />
        <input id="med-email" required type="email" value="${draft.email || ''}" placeholder="Email" class="rounded-DEFAULT border-light-outline-variant bg-light-surface-container-low font-mono text-mono-sm" />
        <textarea id="med-bio" required rows="2" placeholder="Bio..." class="rounded-DEFAULT border-light-outline-variant bg-light-surface-container-low font-body text-body-sm">${draft.bio || ''}</textarea>` : `
        <input id="med-reviewer" required type="text" value="${draft.reviewer}" placeholder="Reviewer Name" class="rounded-DEFAULT border-light-outline-variant bg-light-surface-container-low font-body text-body-sm" />
        <input id="med-company" required type="text" value="${draft.company || ''}" placeholder="Company / Facility" class="rounded-DEFAULT border-light-outline-variant bg-light-surface-container-low font-body text-body-sm" />
        <select id="med-rating" class="rounded-DEFAULT border-light-outline-variant bg-light-surface-container-low font-body text-body-sm">${[5,4,3,2,1].map(n => `<option value="${n}" ${Number(draft.rating)===n?'selected':''}>${n} Stars</option>`).join('')}</select>
        <textarea id="med-text" required rows="2" placeholder="Review text..." class="rounded-DEFAULT border-light-outline-variant bg-light-surface-container-low font-body text-body-sm">${draft.text || ''}</textarea>
        <input id="med-reply" type="text" value="${draft.reply || ''}" placeholder="Admin reply..." class="rounded-DEFAULT border-light-outline-variant bg-light-surface-container-low font-body text-body-sm" />`;

      m.innerHTML = `<form onsubmit="saveMobileEditor(event)" class="w-full max-w-md bg-light-surface-container-lowest rounded-md border border-light-outline-variant p-gutter-lg flex flex-col gap-gutter-sm shadow-xl">
        <div class="flex items-center justify-between"><h2 class="font-title text-title-md">${index >= 0 ? 'Edit' : 'Write'} ${type === 'service' ? 'Service' : type === 'team' ? 'Team Member' : 'Review'}</h2><button type="button" onclick="closeMobileEditor()"><span class="material-symbols-outlined">close</span></button></div>
        ${preview ? previewHtml : formHtml}
        <div class="flex gap-gutter-sm pt-gutter-sm">
          <button type="button" onclick="toggleMobilePreview(${!preview})" class="flex-1 py-gutter-xs rounded-DEFAULT border border-light-outline-variant font-label text-label-sm">${preview ? 'Edit Form' : 'Preview'}</button>
          <button type="submit" class="flex-1 py-gutter-xs rounded-DEFAULT bg-light-primary text-light-on-primary font-label text-label-sm">Save</button>
        </div>
      </form>`;
    }

    renderDrawer();
    renderMobile();
  </script>


</body></html>
